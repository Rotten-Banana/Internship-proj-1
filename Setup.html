<!DOCTYPE html>
<html>
<head>
	<title>Setup</title>
	<link rel="stylesheet" type="text/css" href="Style.css">
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300&display=swap" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script type="text/javascript" src="script.js"></script>
</head>
<body>
	<nav>
		<h1 id="setup">Setup</h1>
		<h1 id="others">Others</h1>
		<h1 id="some">some</h1>
	</nav>
	<div class="side_nav">
		<ul id="setup_nav" class="nav_list">
			<li class="nav_item" id="network">Network</li>
			<li class="nav_item" id="device">Device</li>
		</ul>
		<ul id="other_nav" class="nav_list hide">
			<li class="nav_item">none</li>
			<li class="nav_item">none</li>
		</ul>
		<ul id="some_nav" class="nav_list hide">
			<li class="nav_item">no</li>
			<li class="nav_item">no</li>
		</ul>
	</div>
	<div id="content">
		<div id="Network" class="content">
			<div id="Connections" class="card">
				<h3>Networks</h3>
				<div class="refresh">
					<button id="refresh" class="blue">Refresh</button>	
				</div>
				<div class="network_list">
					<ul id="network_list">
						<li>New Newtwork 1</li><p>RSSI</p>
					</ul>	
				</div>
			</div>
			<div id="Manual" class="card">
				<h3>Add Manually</h3>
				<input type="SSID" id="SSID" name="SSID" placeholder="SSID">
				<input type="Password" id="Password" name="Password" placeholder="Password">
			</div>
		</div>
		<div id="unready_content" class="unready hide">
			<h1>Not Available</h1>
		</div>
	</div>
</body>
</html>
